version: '3.8'

services:
  # =============================================================================
  # BACKEND NODE.JS
  # =============================================================================
  node-api:
    build:
      context: ./caixa-dashboard
      dockerfile: Dockerfile
    container_name: caixacombo-node-api
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL obrigatorio (Supabase PostgreSQL)}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET obrigatorio}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS obrigatorio}
      - PAYMENT_SERVICE_URL=http://payment-service:8080
      - NODEJS_API_SECRET=${NODEJS_API_SECRET:?NODEJS_API_SECRET obrigatorio}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME obrigatorio}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD obrigatorio}
    volumes:
      - node_uploads:/app/uploads
    networks:
      - caixacombo-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # MICROSERVICO SPRING BOOT
  # =============================================================================
  payment-service:
    build:
      context: ./caixacombo-payment-service
      dockerfile: Dockerfile
    container_name: caixacombo-payment-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL obrigatorio}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME obrigatorio}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD obrigatorio}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET obrigatorio}
      - STONE_API_URL=${STONE_API_URL:-https://api.stone.com.br}
      - STONE_API_KEY=${STONE_API_KEY}
      - STONE_MERCHANT_ID=${STONE_MERCHANT_ID}
      - STONE_ENVIRONMENT=${STONE_ENVIRONMENT:-PRODUCTION}
      - NODEJS_API_URL=http://node-api:3001
      - NODEJS_API_SECRET=${NODEJS_API_SECRET:?NODEJS_API_SECRET obrigatorio}
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - caixacombo-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # FRONTEND REACT
  # =============================================================================
  frontend:
    build:
      context: ./caixa-dashboard/frontend
      dockerfile: Dockerfile
    container_name: caixacombo-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - node-api
    networks:
      - caixacombo-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  node_uploads:

networks:
  caixacombo-net:
    driver: bridge
