services:
  # Backend Node.js (API)
  - type: web
    name: caixa-combo-api
    env: node
    buildCommand: cd caixa-dashboard && npm install
    startCommand: cd caixa-dashboard && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODEJS_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Frontend React (Static Site)
  - type: static
    name: caixa-combo-frontend
    buildCommand: cd caixa-dashboard/frontend && npm install && npm run build
    staticPublishPath: caixa-dashboard/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://caixa-combo-api.onrender.com
