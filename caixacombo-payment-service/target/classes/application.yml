server:
  port: 8080
  servlet:
    context-path: /api/v1
  ssl:
    enabled: ${SSL_ENABLED:false}
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

spring:
  application:
    name: caixacombo-payment-service

  # H2 Database (desenvolvimento)
  datasource:
    url: jdbc:h2:mem:caixacombo_payments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    defer-datasource-initialization: true

  # H2 Console (desabilitado em produção)
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  # Flyway desabilitado para H2
  flyway:
    enabled: false

  # Redis (desabilitado para dev)
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ (desabilitado para dev)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Jackson
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null

# JWT (obrigatório definir JWT_SECRET em produção)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Stone API
stone:
  api-url: https://api.stone.com.br
  api-key: ${STONE_API_KEY:}
  merchant-id: ${STONE_MERCHANT_ID:}
  environment: ${STONE_ENVIRONMENT:PRODUCTION}

# Node.js API
nodejs:
  api-url: http://localhost:3001
  api-secret: ${NODEJS_API_SECRET:}

# Cache TTL (seconds)
cache:
  ttl:
    products: 300
    categories: 600
    config: 900

# RestTemplate timeouts
resttemplate:
  connect-timeout: 5000
  read-timeout: 30000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

# Logging
logging:
  level:
    com.caixacombo.payment: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
