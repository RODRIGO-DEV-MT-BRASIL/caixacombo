server:
  port: 8080
  servlet:
    context-path: /api/v1
  ssl:
    enabled: ${SSL_ENABLED:false}
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

spring:
  application:
    name: caixacombo-payment-service

  # PostgreSQL (Supabase)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/caixacombo_payments}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate  # NUNCA usar create-drop em producao
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # Flyway para migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null

# JWT (obrigatório definir JWT_SECRET em produção)
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET obrigatorio}
  expiration: 86400000

# Stone API
stone:
  api-url: ${STONE_API_URL:https://api.stone.com.br}
  api-key: ${STONE_API_KEY:}
  merchant-id: ${STONE_MERCHANT_ID:}
  environment: ${STONE_ENVIRONMENT:PRODUCTION}

# Node.js API
nodejs:
  api-url: ${NODEJS_API_URL:http://localhost:3001}
  api-secret: ${NODEJS_API_SECRET:}

# Cache TTL (seconds)
cache:
  ttl:
    products: 300
    categories: 600
    config: 900

# RestTemplate timeouts
resttemplate:
  connect-timeout: 5000
  read-timeout: 30000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.caixacombo.payment: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
